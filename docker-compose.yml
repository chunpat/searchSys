services:
  app:
    build: .
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      QUOTE_SECURE_COOKIES: "1"
    volumes:
      - quote_data:/app/data
    networks:
      - internal

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal

networks:
  internal:

volumes:
  quote_data:
  caddy_data:
  caddy_config:
