<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录·定制报价查询</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-brand" aria-label="系统信息">
        <div class="login-brand-name">定制报价查询</div>
        <div class="login-brand-meta">内部报价数据</div>
      </section>
      <section class="login-panel">
        <div>
          <h1>账号登录</h1>
          <p>请使用已分配的内部账号。</p>
        </div>
        <form id="loginForm" class="login-form">
          <label>
            <span>用户名</span>
            <input name="username" autocomplete="username" required autofocus />
          </label>
          <label>
            <span>密码</span>
            <input name="password" type="password" autocomplete="current-password" required />
          </label>
          <button id="loginButton" class="primary-button" type="submit">登录</button>
          <div id="loginError" class="login-error" role="alert" hidden></div>
        </form>
      </section>
    </main>
    <script src="/login.js"></script>
  </body>
</html>
